# This file is part of imintty project

# Build image; of course imintty has nothing to do with Visual Studio -
# this is just the name of Appveyor's build environment image
# that also contains cygwin
image: Visual Studio 2022

# Version format
version: "#{build}"

# Do not increment build number after pull requests
pull_requests:
  do_not_increment_build_number: true

# Do not start a new build when a new Git tag is created
skip_tags: true

build_script:
- cmd: |
    set PATH=C:\cygwin64\bin;%PATH%
    make

test_script:
- cmd: |
    bin\imintty.exe --log imintty.log --exec echo hello imintty
    grep hello imintty.log
    bin\imintty.exe --log - --exec echo hello stdout | grep hello
